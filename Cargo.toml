[package]
name = "favicon-maker"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }
native-windows-gui = "1.0"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true